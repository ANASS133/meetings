spring.application.name=demo

# إعدادات البورت ديال السيرفر
server.port=8080

# إعدادات الاتصال بـ MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/meetings_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# إعدادات Spring Data JPA و Hibernate باش يكريي الجداول بوحدو
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed test data from src/main/resources/data.sql after Hibernate creates/updates tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =============================================================
# JWT
# =============================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47
app.jwt.expiration-ms=86400000

# =============================================================
# File Upload
# =============================================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =============================================================
# Static Resources (for serving uploaded files)
# =============================================================
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# =============================================================
# Data Retention Policy
# =============================================================
# Keep history entries for 180 days
app.historique.retention-days=180
# Run cleanup job every night at 2:00 AM
app.historique.cleanup-cron=0 0 2 * * ?
